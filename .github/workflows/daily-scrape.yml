name: daily-scrape

on:
  # 06:05 Europe/Prague summer (CEST = UTC+2) → 04:05 UTC
  # 07:05 Europe/Prague winter (CET  = UTC+1) → 06:05 UTC
  # We schedule both; the Edge Function only emails at the user's alert_hour.
  schedule:
    - cron: "5 4 * * *"
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rohlik-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Download warehouse session from Supabase
        working-directory: scraper
        run: python fetch_session.py

      - name: Scrape /zachran-a-usetri
        working-directory: scraper
        run: python rohlik_alert.py dump > today.json

      - name: Push to Supabase + trigger dispatch-alerts
        working-directory: scraper
        run: python push_to_supabase.py today.json

      - name: Upload today.json as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-${{ github.run_id }}
          path: scraper/today.json
          if-no-files-found: ignore
          retention-days: 7
