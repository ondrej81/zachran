name: deploy-function

# Deploy the dispatch-alerts Edge Function to Supabase. Runs automatically when
# anything under supabase/functions/** changes on the deploy branch, and is
# also runnable on demand from the Actions tab (workflow_dispatch). Lets you
# update the function without opening a terminal — Supabase's web dashboard
# only supports single-file functions, ours has _shared/email.ts.

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "claude/**"]
    paths: ["supabase/functions/**"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy dispatch-alerts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy dispatch-alerts \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt
